name: Build, version and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'webpack.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Capture what actually changed since the last release *before* bumping
      # the version or creating any commits of our own, so the changelog only
      # contains real, human-written commit messages -- this becomes the
      # "what's new" people see in the popup's update banner.
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          {
            echo "changelog<<CHANGELOG_EOF"
            git log "$RANGE" --pretty=format:"- %s" --no-merges | grep -v "^- chore: release v" || echo "- Maintenance update"
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Every build that lands on main is a new, detectable version — the
      # extension's background service worker compares its own version
      # against the latest GitHub Release to decide whether to show an
      # "update available" banner in the popup.
      - name: Bump patch version
        id: version
        run: echo "version=$(node scripts/bump-version.js patch)" >> "$GITHUB_OUTPUT"

      - run: npm run build-prod

      # Keep the pre-built extension/ folder in the repo up to date so users
      # can download the repo directly and "Load unpacked" it — no Node/npm
      # required on their end.
      - name: Commit updated build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension src/manifest.json package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Zip extension folder
        run: (cd extension && zip -r ../erp-toolkit-v${{ steps.version.outputs.version }}.zip .)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: erp-toolkit-v${{ steps.version.outputs.version }}.zip
          body: |
            ### What's new

            ${{ steps.changelog.outputs.changelog }}

            ### Install

            Download **`erp-toolkit-v${{ steps.version.outputs.version }}.zip`** below — that's the built extension, ready for **Load unpacked**.

            > Ignore the auto-generated "Source code (zip)" / "(tar.gz)" links further down — GitHub adds those to every release automatically, and they contain the whole repository (source, configs, everything), not just the extension.

            1. Unzip `erp-toolkit-v${{ steps.version.outputs.version }}.zip`
            2. Open `chrome://extensions`, enable **Developer mode**
            3. Click **Load unpacked** and select the unzipped folder
